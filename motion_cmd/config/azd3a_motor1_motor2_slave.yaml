# Combined AZD3A-KED configuration for logical Motor 1 (Axis 1 CSP) and
# logical Motor 2 (Axis 2 CSV) on one physical EtherCAT slave.
vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}
      - {index: 0x607a, sub_index: 0, type: int32, command_interface: position, factor: -833333.3333333334, offset: 1999.0, default: .nan}
      - {index: 0x6060, sub_index: 0, type: int8, default: 8}
  - index: 0x1612
    channels:
      - {index: 0x6840, sub_index: 0, type: uint16, default: 0}
      - {index: 0x68ff, sub_index: 0, type: int32, command_interface: velocity, factor: 11459.155902616465, default: 0}
      - {index: 0x6860, sub_index: 0, type: int8, default: 9}

tpdo:
  - index: 0x1a00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16}
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position, factor: -0.0000012, offset: 0.0023988}
      - {index: 0x6061, sub_index: 0, type: int8}
  - index: 0x1a11
    channels:
      - {index: 0x6841, sub_index: 0, type: uint16}
      - {index: 0x6864, sub_index: 0, type: int32}
      - {index: 0x686c, sub_index: 0, type: int32, state_interface: velocity, factor: 0.00008726646259971647}
      - {index: 0x6861, sub_index: 0, type: int8}
