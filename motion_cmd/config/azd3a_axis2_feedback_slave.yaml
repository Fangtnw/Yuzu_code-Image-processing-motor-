# AZD3A-KED Axis 2 feedback-only PDO configuration.
# Motor: AZM46AK-FC7.2UA, 7.2:1 FC geared output.
# Live electronic gear: A=1, B=1. HM-60323-7E section 3-2 therefore gives
# 10,000 steps per output-shaft revolution.

vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

# Mapping 0x1610 is present only to satisfy the slave's output SyncManager.
# Controlword and mode are deliberately held at zero: this configuration must
# not perform CiA 402 state transitions or enable Axis 2.
rpdo:
  - index: 0x1610
    channels:
      - {index: 0x6840, sub_index: 0, type: uint16, default: 0}
      - {index: 0x687a, sub_index: 0, type: int32, default: 0}
      - {index: 0x6860, sub_index: 0, type: int8, default: 0}

# Mapping 0x1A11 includes both position [step] and velocity [Hz = step/s].
# 2*pi / 10,000 converts both values to ROS radians and radians/second.
tpdo:
  - index: 0x1a11
    channels:
      - {index: 0x6841, sub_index: 0, type: uint16}
      - {index: 0x6864, sub_index: 0, type: int32, state_interface: position, factor: 0.0006283185307179586}
      - {index: 0x686c, sub_index: 0, type: int32, state_interface: velocity, factor: 0.0006283185307179586}
      - {index: 0x6861, sub_index: 0, type: int8}
