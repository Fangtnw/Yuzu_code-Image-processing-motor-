# AZD3A #2 (slave 1), local Axis 3 / Motor 6 conveyor in CSP mode.
# AZM46AK-PS50: 50:1, A=1/B=1, 500,000 counts/output revolution.
vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

rpdo:
  - index: 0x1620
    channels:
      - {index: 0x7040, sub_index: 0, type: uint16, default: 0}
      # ROS output-shaft radians -> AZD3A encoder counts.
      - {index: 0x707a, sub_index: 0, type: int32, command_interface: position, factor: 79577.47154594767, default: .nan}
      - {index: 0x7060, sub_index: 0, type: int8, default: 8}

tpdo:
  - index: 0x1a21
    channels:
      - {index: 0x7041, sub_index: 0, type: uint16, state_interface: motor6_status}
      - {index: 0x7064, sub_index: 0, type: int32, state_interface: position, factor: 0.000012566370614359173}
      - {index: 0x706c, sub_index: 0, type: int32, state_interface: velocity, factor: 0.000012566370614359173}
      - {index: 0x7061, sub_index: 0, type: int8}
