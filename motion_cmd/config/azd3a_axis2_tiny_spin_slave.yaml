# AZD3A Axis 2 cyclic synchronous velocity commissioning configuration.
# Live A=1/B=1 gives 10,000 steps/output revolution.
vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

rpdo:
  - index: 0x1612
    channels:
      - {index: 0x6840, sub_index: 0, type: uint16, default: 0}
      # ROS rad/s -> AZD3A Hz (steps/s).
      - {index: 0x68ff, sub_index: 0, type: int32, command_interface: velocity, factor: 1591.5494309189535, default: 0}
      - {index: 0x6860, sub_index: 0, type: int8, default: 9}

tpdo:
  - index: 0x1a11
    channels:
      - {index: 0x6841, sub_index: 0, type: uint16}
      - {index: 0x6864, sub_index: 0, type: int32, state_interface: position, factor: 0.0006283185307179586}
      - {index: 0x686c, sub_index: 0, type: int32, state_interface: velocity, factor: 0.0006283185307179586}
      - {index: 0x6861, sub_index: 0, type: int8}
