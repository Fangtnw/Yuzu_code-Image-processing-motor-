# AZD3A #1 (slave 0), local Axis 3 / logical Motor 3 in CSP mode.
# DR28T1A03-AZAKR: 1 mm lead, A=1/B=1, 10,000 counts/mm.
vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

rpdo:
  - index: 0x1620
    channels:
      - {index: 0x7040, sub_index: 0, type: uint16, default: 0}
      - {index: 0x707a, sub_index: 0, type: int32, command_interface: position, factor: 10000000.0, default: .nan}
      - {index: 0x7060, sub_index: 0, type: int8, default: 8}

tpdo:
  - index: 0x1a20
    channels:
      - {index: 0x7041, sub_index: 0, type: uint16}
      - {index: 0x7064, sub_index: 0, type: int32, state_interface: position, factor: 0.0000001}
      - {index: 0x7061, sub_index: 0, type: int8}
