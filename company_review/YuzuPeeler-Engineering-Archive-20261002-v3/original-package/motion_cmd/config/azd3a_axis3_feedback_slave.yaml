# AZD3A-KED Axis 3 feedback-only PDO configuration.
# Motor: AZM46AK-FC20DA, 20:1 geared output.
# A=1/B=1 gives 10,000 counts/motor revolution. The FC20 gearhead makes this
# 200,000 counts per machine-output revolution.

vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

# Mapping 0x1620 satisfies the Axis 3 output SyncManager. Controlword, target,
# and mode remain zero, so this configuration cannot enable Axis 3.
rpdo:
  - index: 0x1620
    channels:
      - {index: 0x7040, sub_index: 0, type: uint16, default: 0}
      - {index: 0x707a, sub_index: 0, type: int32, default: 0}
      - {index: 0x7060, sub_index: 0, type: int8, default: 0}

# 2*pi / 200,000 converts step and step/s feedback to output rad and rad/s.
tpdo:
  - index: 0x1a21
    channels:
      - {index: 0x7041, sub_index: 0, type: uint16}
      - {index: 0x7064, sub_index: 0, type: int32, state_interface: position, factor: 0.00003141592653589793}
      - {index: 0x706c, sub_index: 0, type: int32, state_interface: velocity, factor: 0.00003141592653589793}
      - {index: 0x7061, sub_index: 0, type: int8}
