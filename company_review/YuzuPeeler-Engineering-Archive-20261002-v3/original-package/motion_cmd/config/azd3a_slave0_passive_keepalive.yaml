# Passive cyclic keepalive for upstream AZD3A slave 0 while commissioning
# Motor 4 on slave 1. GenericEcSlave writes Controlword=0 and mode=0, so it
# cannot enable or move Motor 1. The cyclic RPDO prevents AL code 0x001B
# (SyncManager watchdog) when the EtherCAT master requests both slaves OP.
vendor_id: 0x000002BE
product_id: 0x000013AF
assign_activate: 0x0300
auto_fault_reset: false

rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, command_interface: ~, default: 0}
      - {index: 0x607a, sub_index: 0, type: int32, command_interface: ~, default: 0}
      - {index: 0x6060, sub_index: 0, type: int8, command_interface: ~, default: 0}

tpdo:
  - index: 0x1a00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16, state_interface: ~}
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position, factor: 0.0000012}
      - {index: 0x6061, sub_index: 0, type: int8, state_interface: ~}
